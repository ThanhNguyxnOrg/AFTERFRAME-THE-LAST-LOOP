name: Package and publish itch.io HTML5 build

on:
  workflow_dispatch:
    inputs:
      publish_to_itch:
        description: Publish the verified build to itch.io after all checks pass
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - "scripts/**"
      - ".github/workflows/itch-html5.yml"
      - ".github/README.md"
      - "docs/ITCH_IO_RELEASE.md"

permissions:
  contents: read

concurrency:
  group: itch-html5-package
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package browser game
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require main branch when publication is requested
        # Explicit release trigger: opt-in workflow_dispatch input or [publish-itch] on a main-branch commit.
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to_itch == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-itch]')) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::itch.io publishing is only allowed from the main branch. Re-run this workflow on main."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Run test suite
        run: bun run test

      - name: Build portable HTML5 game
        run: bun run build

      - name: Validate and create itch.io ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import struct
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          index = dist / "index.html"
          if not index.is_file() or index.stat().st_size == 0:
              raise SystemExit("Missing or empty dist/index.html")

          html = index.read_text(encoding="utf-8")
          if './assets/' not in html:
              raise SystemExit("Vite output does not use relative ./assets/ URLs")

          required_assets = [
              "helix_containment_gate.glb",
              "choir_acoustic_organ.glb",
              "curator_archive_monolith.glb",
              "matron_surgical_pod.glb",
          ]
          bundle_text = "\n".join(
              path.read_text(encoding="utf-8")
              for path in dist.rglob("*.js")
          )
          for name in required_assets:
              asset = dist / "assets" / "blender" / "phase12" / name
              if not asset.is_file():
                  raise SystemExit(f"Missing built GLB asset: {asset}")
              if f"assets/blender/phase12/{name}" not in bundle_text:
                  raise SystemExit(f"Built JavaScript does not reference {name}")

              data = asset.read_bytes()
              if len(data) < 20 or data[:4] != b"glTF":
                  raise SystemExit(f"Invalid GLB header: {asset}")
              magic, version, declared_length = struct.unpack_from("<4sII", data, 0)
              if version != 2 or declared_length != len(data):
                  raise SystemExit(f"Invalid GLB version/length: {asset}")

              offset = 12
              json_chunk = None
              while offset < len(data):
                  if offset + 8 > len(data):
                      raise SystemExit(f"Truncated GLB chunk header: {asset}")
                  chunk_length, chunk_type = struct.unpack_from("<II", data, offset)
                  end = offset + 8 + chunk_length
                  if end > len(data):
                      raise SystemExit(f"Truncated GLB chunk: {asset}")
                  if chunk_type == 0x4E4F534A and json_chunk is None:
                      json_chunk = data[offset + 8:end]
                  offset = end
              if json_chunk is None:
                  raise SystemExit(f"Missing GLB JSON chunk: {asset}")
              gltf = json.loads(json_chunk.decode("utf-8").rstrip(" \t\r\n\0"))
              if gltf.get("asset", {}).get("version") != "2.0":
                  raise SystemExit(f"Unsupported glTF version: {asset}")
              print(f"Validated {asset} ({len(data):,} bytes)")

          files = sorted(path for path in dist.rglob("*") if path.is_file())
          total_size = sum(path.stat().st_size for path in files)
          if len(files) > 1000:
              raise SystemExit(f"itch.io limit exceeded: {len(files)} files (maximum 1,000)")
          if total_size > 500 * 1024 * 1024:
              raise SystemExit(f"itch.io limit exceeded: {total_size:,} extracted bytes (maximum 500 MiB)")

          archive = Path("AFTERFRAME-THE-LAST-LOOP-itch-html5.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as output:
              for path in files:
                  output.write(path, path.relative_to(dist).as_posix())

          with zipfile.ZipFile(archive) as package:
              names = package.namelist()
              if "index.html" not in names:
                  raise SystemExit("ZIP root must contain index.html")
              if package.testzip() is not None:
                  raise SystemExit("ZIP integrity check failed")

          print(f"Created {archive} ({archive.stat().st_size:,} bytes)")
          print(f"Packaged {len(files)} files; extracted size {total_size:,} bytes")
          PY

      - name: Install browser smoke-test tooling
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Run browser smoke test against the exact ZIP
        run: node scripts/itch-browser-smoke.mjs

      - name: Upload itch.io package
        uses: actions/upload-artifact@v4
        with:
          name: AFTERFRAME-THE-LAST-LOOP-itch-html5
          path: AFTERFRAME-THE-LAST-LOOP-itch-html5.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified ZIP to itch.io
    needs: package
    # A marked main-branch commit is an explicit one-shot release; ordinary pushes remain build-only.
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish_to_itch == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-itch]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Project destination is repository-specific; keep ITCHIO_GAME as a repository Actions variable.
    env:
      ITCHIO_GAME: ${{ vars.ITCHIO_GAME }}
    steps:
      - name: Validate itch.io publishing configuration
        shell: bash
        env:
          # BUTLER_API_KEY is an Organization Actions secret shared with explicitly selected repositories.
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${BUTLER_API_KEY:-}" ]]; then
            echo "::error::Missing Organization Actions secret BUTLER_API_KEY or this repository is not authorized to access it. Add the itch.io API key (source: wharf) under ThanhNguyxnOrg → Settings → Secrets and variables → Actions, and grant AFTERFRAME-THE-LAST-LOOP access."
            exit 1
          fi
          if [[ -z "${ITCHIO_GAME:-}" ]]; then
            echo "::error::Missing repository Actions variable ITCHIO_GAME. Set it in AFTERFRAME-THE-LAST-LOOP → Settings → Secrets and variables → Actions → Variables to thanhnguyxn/afterframe-the-last-loop."
            exit 1
          fi
          if [[ "$ITCHIO_GAME" != "${ITCHIO_GAME,,}" || "$ITCHIO_GAME" != */* || "$ITCHIO_GAME" == */*/* || "$ITCHIO_GAME" == /* || "$ITCHIO_GAME" == */ || "$ITCHIO_GAME" =~ [[:space:]] || "$ITCHIO_GAME" == *://* ]]; then
            echo "::error::Invalid ITCHIO_GAME. Expected lowercase account/project-slug, not a URL."
            exit 1
          fi
          echo "itch.io target configuration is present (target value is intentionally not echoed)."

      - name: Download the package artifact from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: AFTERFRAME-THE-LAST-LOOP-itch-html5
          path: release-artifact

      - name: Re-validate the exact ZIP before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("release-artifact/AFTERFRAME-THE-LAST-LOOP-itch-html5.zip")
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit(f"Missing or empty verified artifact: {archive}")
          with ZipFile(archive) as package:
              if "index.html" not in package.namelist():
                  raise SystemExit("Downloaded game ZIP is missing root index.html")
              corrupt_entry = package.testzip()
              if corrupt_entry is not None:
                  raise SystemExit(f"Downloaded game ZIP is corrupt at {corrupt_entry}")
          print(f"Re-validated {archive} ({archive.stat().st_size:,} bytes)")
          PY

      - name: Install official stable Butler CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/butler-linux-amd64.zip"
          install_dir="$RUNNER_TEMP/butler"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$archive"
          unzip -q "$archive" -d "$install_dir"
          butler_bin="$(find "$install_dir" -type f -name butler -print -quit)"
          if [[ -z "$butler_bin" ]]; then
            echo "::error::The official Butler archive did not contain the butler executable."
            exit 1
          fi
          chmod +x "$butler_bin"
          "$butler_bin" version
          echo "$(dirname "$butler_bin")" >> "$GITHUB_PATH"

      - name: Publish verified HTML5 channel
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          butler push \
            release-artifact/AFTERFRAME-THE-LAST-LOOP-itch-html5.zip \
            "${ITCHIO_GAME}:html5" \
            --userversion "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"