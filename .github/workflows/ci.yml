name: AFTERFRAME CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Test, Build & Asset Integrity (Bun 1.4.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Strict TypeScript typecheck
        run: bun run lint

      - name: Deterministic simulation & lifecycle test suites
        run: bun run test

      - name: Production Vite bundle build & GLB asset verification
        run: |
          bun run build
          test -f dist/index.html
          test -f dist/assets/blender/phase12/helix_containment_gate.glb
          test -f dist/assets/blender/phase12/choir_acoustic_organ.glb
          test -f dist/assets/blender/phase12/curator_archive_monolith.glb
          test -f dist/assets/blender/phase12/matron_surgical_pod.glb
