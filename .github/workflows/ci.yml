name: AFTERFRAME CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@2bda8e8e8073a2578db4bbb1e0f6aaf21d061bcd
    with:
      job_name: Verify (Bun + CCGS)
      node_version: "22"
      package_manager: bun
      package_manager_version: "1.4.4"
      cache: ""
      install_command: bun install --frozen-lockfile
      lint_command: bun run lint
      test_command: bun run test
      build_command: bun run build
      post_build_command: |
        set -euo pipefail
        bash .claude/scripts/registry.sh validate
        bash .claude/scripts/project-coherence.sh
        bash .claude/scripts/skill-lint.sh code-review
