# Architecture Registry
# Single source of truth for architectural decisions across the project.
# Populated by the system-architect and lead-programmer agents during Stage 2
# and updated whenever a new ADR is accepted. Read by the consistency-check
# skill during validation.

version: 1

state_ownership:
  - state: "WorldState (player, echo, resonance, enemies, boss, progression, exploration, run)"
    owner: "SimulationModule (src/game/simulation.ts)"
    readers: [App, ArenaSceneRenderer, GameHud, StatusModal, TitleScreen]
    adr: docs/AFTERFRAME_PHASE23_1_RELEASE_COMPLETION_AND_AUDIT.md
    status: active

  - state: "CameraSettings & FrameInput"
    owner: "InputController (src/game/input.ts)"
    readers: [App, ArenaSceneRenderer, SoundEngine, GameHud, StatusModal, TitleScreen]
    adr: docs/AFTERFRAME_PHASE23_1_RELEASE_COMPLETION_AND_AUDIT.md
    status: active

interfaces:
  - contract: "StepWorldContract"
    provider: "src/game/simulation.ts"
    consumers: [src/App.tsx, src/game/simulation.test.ts]
    signature: "stepWorld(world: WorldState, input: FrameInput, dt: number): void"
    adr: docs/AFTERFRAME_PHASE23_1_RELEASE_COMPLETION_AND_AUDIT.md
    status: active

  - contract: "SaveV2PersistenceContract"
    provider: "src/game/simulation.ts"
    consumers: [src/App.tsx, src/game/simulation.test.ts]
    signature: "parseAndApplyCampaignProgress(world: WorldState, rawJson: string | null | undefined): boolean"
    adr: docs/AFTERFRAME_PHASE23_1_RELEASE_COMPLETION_AND_AUDIT.md
    status: active

performance_budgets:
  - system: "Simulation & Three.js ArenaSceneRenderer"
    target_fps: 60
    frame_time_ms: 16.67
    max_memory_mb: 512
    max_draw_calls: 250
    adr: docs/AFTERFRAME_PHASE23_1_RELEASE_COMPLETION_AND_AUDIT.md
    status: active

api_decisions:
  - purpose: "3D Scene Rendering & Procedural Rig Hierarchy"
    chosen: "Three.js 0.186.1 (WebGLRenderer + GLTFLoader)"
    forbidden: [Babylon.js, PlayCanvas]
    adr: docs/AFTERFRAME_PHASE23_1_RELEASE_COMPLETION_AND_AUDIT.md
    status: active

  - purpose: "Synthesized Combat & Stinger Audio"
    chosen: "Browser Web Audio API (SoundEngine masterGain + sfxGain + musicGain)"
    forbidden: [External paid audio SDKs]
    adr: docs/AFTERFRAME_PHASE23_1_RELEASE_COMPLETION_AND_AUDIT.md
    status: active

forbidden_patterns:
  - pattern: "Mutating simulation WorldState from ArenaSceneRenderer or React HUD components"
    reason: "Breaks deterministic simulation and replay parity between live gameplay and reduced-motion/headless modes"
    adr: docs/AFTERFRAME_PHASE23_1_RELEASE_COMPLETION_AND_AUDIT.md
    status: active

  - pattern: "Allowing Echo replay contacts to deal direct HP damage or grant Flux"
    reason: "Echoes only prime Resonance, activate puzzle plates/nodes, and serve as Relay/Collapse anchors"
    adr: docs/AFTERFRAME_PHASE23_1_RELEASE_COMPLETION_AND_AUDIT.md
    status: active
